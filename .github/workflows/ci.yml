# Intégration continue : à chaque push et pull request.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verifier:
    name: Types, build et tests (API + front)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm 10.9 échoue sur ce workspace (« Cannot read properties of null (reading 'edgesOut') »).
      - name: npm 11
        run: npm install -g npm@11

      - name: Installation
        run: npm ci

      - name: Vérification des types (API, front, e2e)
        run: npm run typecheck

      - name: Build du front
        run: npm run build

      - name: Tests API (Workers + D1 local)
        run: npm test -w api

      - name: Tests front (Vitest)
        run: npm test -w front

  e2e:
    name: Tests de bout en bout (Playwright)
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm 11
        run: npm install -g npm@11

      - name: Installation
        run: npm ci

      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Build du front puis tests e2e
        run: npm run e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.state/wrangler.log
          retention-days: 7
